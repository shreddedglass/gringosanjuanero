media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog (artículos)
    type: collection
    path: src/content/blog
    filename: "{primary}.md"
    view:
      fields: [title, etiqueta, date, borrador]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Fecha
        type: date
        required: true
      - name: etiqueta
        label: Etiqueta (decide en qué página aparece)
        type: select
        required: true
        options:
          values: [explorar, alojamiento, comida]
      - name: resumen
        label: Resumen corto (sale en las tarjetas y en Google)
        type: text
        required: true
      - name: portada
        label: Foto principal
        type: image
      - name: video
        label: Enlace del video de TikTok (el enlace completo, con /video/ y números)
        type: string
      - name: lugar
        label: "Datos rápidos: Dónde queda"
        type: string
      - name: comoLlegar
        label: "Datos rápidos: Cómo llegar"
        type: string
      - name: costo
        label: "Datos rápidos: Costo"
        type: string
      - name: mejorMomento
        label: "Datos rápidos: Mejor momento"
        type: string
      - name: mapa
        label: Ubicación en el mapa (nombre del lugar o enlace de Google Maps)
        type: string
      - name: consejo
        label: Consejo del gringo
        type: text
      - name: borrador
        label: Borrador (no se publica)
        type: boolean
        default: false
      - name: body
        label: Texto del artículo
        type: rich-text

  - name: lugares
    label: Lugares (Explorar, Hospedarse, Comer)
    type: collection
    path: src/content/lugares
    filename: "{primary}.md"
    view:
      fields: [nombre, pagina, pueblo, favorito]
      primary: nombre
      sort: [nombre, pagina]
    fields:
      - name: nombre
        label: Nombre del lugar
        type: string
        required: true
      - name: pagina
        label: Página donde aparece
        type: select
        required: true
        options:
          values: [explorar, hospedarse, comer]
      - name: pueblo
        label: Pueblo o provincia (sale como filtro "Lugar")
        type: string
        required: true
      - name: tipo
        label: Tipo (ej. Salto, Río, Playa, Hotel, Restaurante; sale como filtro "Tipo")
        type: string
        required: true
      - name: etiquetas
        label: Ideal para (ej. Con amigos, En familia, Gratis; salen como filtros)
        type: string
        list: true
      - name: resumen
        label: Descripción corta (sale en la tarjeta)
        type: text
        required: true
      - name: foto
        label: Foto
        type: image
      - name: ubicacion
        label: Ubicación para el mapa (nombre y pueblo, o coordenadas como 18.80,-71.23)
        type: string
      - name: mapsUrl
        label: Enlace de Google Maps (opcional)
        type: string
      - name: video
        label: Enlace del video de TikTok (opcional)
        type: string
      - name: consejo
        label: Consejo del gringo (opcional)
        type: text
      - name: favorito
        label: "Favorito del Gringo: 1, 2 o 3 (0 = no es favorito)"
        type: number
        default: 0
      - name: borrador
        label: Borrador (no se publica)
        type: boolean
        default: false
      - name: body
        label: Reseña completa
        type: rich-text

  - name: site
    label: Textos de la página de inicio
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: lema
        label: Lema
        type: string
      - name: descripcion
        label: Descripción para Google
        type: text
      - name: heroTexto
        label: Texto debajo del título principal
        type: text
      - name: heroFoto
        label: Foto principal de la portada
        type: image
      - name: sobreMiTitulo
        label: "¿Quién soy? – Título"
        type: string
      - name: sobreMiTexto
        label: "¿Quién soy? – Texto"
        type: text
      - name: ctaTitulo
        label: Llamado final – Título
        type: string
      - name: ctaTexto
        label: Llamado final – Texto
        type: text
      - name: tiktok
        label: Enlace de TikTok
        type: string
      - name: instagram
        label: Enlace de Instagram
        type: string
